# Copy to /etc/nginx/snippets/leapgames-headers.conf. Included in every location, because a location
# with its own add_header (Cache-Control) does not inherit the server-level ones.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
