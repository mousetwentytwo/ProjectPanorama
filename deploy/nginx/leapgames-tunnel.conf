# Leap Games, static files, behind the Cloudflare Tunnel already running on the shared VPS.
# nginx listens on loopback only; cloudflared forwards leapgames.twentytwosoftware.com here.
# Port 10486 sits next to the other subsites (10480-10489, see the hub's port table); no TLS on origin, no open port, no firewall rule.
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/; copy
# leapgames-headers.conf to /etc/nginx/snippets/; then
#   sudo nginx -t && sudo systemctl reload nginx
# Tunnel ingress (/etc/cloudflared/config.yml, or a Public Hostname in the dashboard), above the 404:
#   - hostname: leapgames.twentytwosoftware.com
#     service: http://localhost:10486

server {
    listen 127.0.0.1:10486;
    server_name leapgames.twentytwosoftware.com;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # deploy/deploy.sh uploads each release and points this symlink at it.
    root /var/www/leapgames/current;
    index index.html;
    # Relative Location headers: the origin port/scheme (http :10486) must not leak past the tunnel.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Unhashed file names: short cache, revalidate on deploy.
    location ~ ^/src/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        include /etc/nginx/snippets/leapgames-headers.conf;
    }

    # Bare / opens the games straight into SAVE UX (mouse/touch or Leap); any query string is kept as given.
    location = / {
        if ($args = "") { return 302 /?mode=games&game=saveux; }
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/leapgames-headers.conf;
    }

    # Static files only; real 404s for anything else.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/leapgames-headers.conf;
    }

    access_log /var/log/nginx/leapgames.access.log;
    error_log  /var/log/nginx/leapgames.error.log;
}
